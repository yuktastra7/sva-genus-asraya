<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Family Weekly Planner</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Family Command Center</h1>
        <p id="current-date"></p>
    </header>

    <main class="planner-grid">
        <!-- Shiva (Father) -->
        <section id="shiva" class="member-card">
            <div class="card-header">
                <h2>Shiva</h2>
                <span>Father</span>
            </div>
            <div class="task-list"></div>
        </section>

        <!-- Parvati (Mother) -->
        <section id="parvati" class="member-card">
            <div class="card-header">
                <h2>Parvati</h2>
                <span>Mother</span>
            </div>
            <div class="task-list"></div>
        </section>

        <!-- Ganesha (10yr Son) -->
        <section id="ganesha" class="member-card">
            <div class="card-header">
                <h2>Ganesha</h2>
                <span>Elder Son (10)</span>
            </div>
            <div class="task-list"></div>
        </section>

        <!-- Subramanya (5yr Son) -->
        <section id="subramanya" class="member-card">
            <div class="card-header">
                <h2>Subramanya</h2>
                <span>Younger Son (5)</span>
            </div>
            <div class="task-list"></div>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
